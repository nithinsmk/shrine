<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termite shrine — eye test</title>
<style>
  :root { --bg: #bbbbbb; --ink: #111; --glow: #d4f23c; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body.dark { --bg: #0b1108; --ink: #d4f23c; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .bar { position: fixed; left: 16px; bottom: 16px; display: flex; gap: 8px; align-items: center;
         font: 13px/1.3 ui-monospace, Menlo, monospace; color: var(--ink); }
  button { font: inherit; color: inherit; background: none; border: 1px solid currentColor;
           padding: 6px 10px; cursor: pointer; }
  #now { opacity: .7; }
  #tune { position: fixed; right: 16px; top: 16px; font: 12px ui-monospace, Menlo, monospace;
          color: var(--ink); white-space: pre; display: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <button id="play">▶ Radio al Hara</button>
  <button id="bg">dark / grey</button>
  <span id="now"></span>
</div>
<div id="tune"></div>
<script src="eye.js"></script>
</body>
</html>
